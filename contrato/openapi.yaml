  /v1/pessoas/{idPessoa}/registros:
    get:
      tags: [Situação vacinal]
      operationId: listarRegistros
      summary: Histórico de doses registradas
      description: |
        Lista os registros de vacinação da pessoa (RF04): vacina, dose, data, lote, fabricante,
        unidade e fonte do registro. Inclui registros que não se encaixam no calendário
        (`idDose` nulo, por exemplo tetra viral ou HPV em esquema especial). Ordem: data de
        aplicação, da mais recente para a mais antiga.
      parameters:
        - $ref: '#/components/parameters/IdPessoa'
      responses:
        '200':
          description: Registros da pessoa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRegistros'
              examples:
                bebeDeSeisMeses:
                  summary: Manuela (pessoa 5), três registros mais antigos
                  value:
                    idPessoa: 5
                    dataUltimaAtualizacao: '2026-11-18T15:07:00-03:00'
                    registros:
                      - id: 52
                        idDose: 7
                        vacina: { id: 3, nome: Penta (DTP/Hib/HB) }
                        imunobiologico: { codigo: '42', sigla: Penta }
                        dose: { codigo: '2', sigla: D2, descricao: 2ª Dose }
                        estrategia: { codigo: '1', descricao: Rotina }
                        dataAplicacao: '2026-11-17'
                        lote: SIMUU3667
                        fabricante: { codigo: '27880', nome: GlaxoSmithKline (GSK) }
                        unidade: { id: 9, nome: USF Fictícia Ibura }
                        transcricao: false
                        dataRegistroNaFonte: '2026-11-18T15:07:00-03:00'
                      - id: 51
                        idDose: 2
                        vacina: { id: 2, nome: Hepatite B }
                        imunobiologico: { codigo: '9', sigla: HB }
                        dose: { codigo: '8', sigla: D, descricao: Dose }
                        estrategia: { codigo: '1', descricao: Rotina }
                        dataAplicacao: '2026-05-10'
                        lote: SIMLQ6024
                        fabricante: { codigo: '164', nome: LG Chem }
                        unidade: { id: 12, nome: Maternidade Fictícia Recife }
                        transcricao: false
                        dataRegistroNaFonte: '2026-05-10T08:35:00-03:00'
                      - id: 50
                        idDose: 1
                        vacina: { id: 1, nome: BCG }
                        imunobiologico: { codigo: '15', sigla: BCG }
                        dose: { codigo: '9', sigla: DU, descricao: Única }
                        estrategia: { codigo: '1', descricao: Rotina }
                        dataAplicacao: '2026-05-09'
                        lote: SIMSQ3515
                        fabricante: { codigo: '151', nome: Fundação Ataulpho de Paiva }
                        unidade: { id: 12, nome: Maternidade Fictícia Recife }
                        transcricao: false
                        dataRegistroNaFonte: '2026-05-09T10:08:00-03:00'
                transcricaoSemLote:
                  summary: Maria (pessoa 1), BCG transcrita do cartão físico
                  value:
                    idPessoa: 1
                    dataUltimaAtualizacao: '2021-11-27T11:49:00-03:00'
                    registros:
                      - id: 1
                        idDose: 1
                        vacina: { id: 1, nome: BCG }
                        imunobiologico: { codigo: '15', sigla: BCG }
                        dose: { codigo: '9', sigla: DU, descricao: Única }
                        estrategia: { codigo: '1', descricao: Rotina }
                        dataAplicacao: '2000-12-26'
                        lote: null
                        fabricante: null
                        unidade: { id: 12, nome: Maternidade Fictícia Recife }

name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # O runner do GitHub tem Docker: o Testcontainers sobe o MySQL 8.4.
      # CI=true faz os testes de banco (API, contrato) quebrarem em vez de serem pulados.
      - name: Testes
        run: ./mvnw -B test
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

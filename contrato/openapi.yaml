  /v1/pessoas/{idPessoa}/doses/{idDose}:
    get:
      tags: [Situação vacinal]
      operationId: obterDetalheDose
      summary: Detalhe de uma dose prevista
      description: |
        Tela 3 do protótipo: situação da dose, quando fica disponível, doenças que a vacina
        previne e os registros ligados a ela. `idDose` é o id da dose no calendário
        (`dose_esquema`).

        Só existe detalhe para dose com situação (as que vêm em `doses` da situação vacinal).
        Dose que está em `dosesForaDaIdade` da pessoa não tem situação (D17, D19) e devolve
        404, assim como um `idDose` que não existe no calendário. O front não deve oferecer
        link de detalhe para essas doses: mostra só a orientação "converse na unidade"
        (aviso `DOSE_FORA_DA_IDADE`).
      parameters:
        - $ref: '#/components/parameters/IdPessoa'
        - name: idDose
          in: path
          required: true
          description: Id da dose no calendário (`dose_esquema.id_dose_esquema`)
          schema:
            type: integer
            minimum: 1
          example: 20
      responses:
        '200':
          description: Detalhe da dose
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheDose'
              examples:
                meningoCSegundaDose:
                  summary: Bernardo (pessoa 48), Meningo C 2ª dose, já pode tomar
                  value:
                    idPessoa: 48
                    dose: { idDose: 20, vacina: { id: 7, nome: Meningocócica C conjugada }, numeroDose: 2, descricao: 5 meses, situacao: PODE_TOMAR, dataRecomendada: '2026-12-13', dataDisponivel: '2026-11-19', registro: null, orientacoes: [] }
                    esquema: Meningo C – 2 doses
                    intervaloMinimoDias: 30
                    doencas:
                      - { id: 10, nome: Doença meningocócica C }
                    registros: []
                    dataUltimaAtualizacao: '2026-10-31T16:21:00-03:00'
                    avisos:
                      - { codigo: REGRA_EM_ALINHAMENTO, mensagem: 'Estas regras ainda estão em alinhamento com a Secretaria de Saúde. Confirme sempre na unidade.' }
                      - { codigo: PREVISAO_DE_ROTINA, mensagem: 'Esta é uma previsão de rotina. Quem define as datas das suas doses é o profissional de saúde: confirme na unidade.' }
                      - { codigo: ATRASO_REGISTRO, mensagem: 'Uma vacina tomada pode levar até 14 dias para aparecer aqui.' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemAcesso'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
          description: |
            Pessoa não encontrada, `idDose` que não existe no calendário ou dose que está em
            `dosesForaDaIdade` da pessoa (sem situação, sem detalhe).


openapi: 3.1.0
info:
  title: Minha vacinação · API do ConectaSaúde Recife
  version: 0.1.0
  summary: Situação vacinal, histórico de doses, unidades, campanhas e vacinas para o módulo "Minha vacinação" do Conecta Recife.
  description: |
    Contrato **v0** do microsserviço do módulo "Minha vacinação" (decisão D14). É a fonte de verdade
    para o backend (Spring Boot) e para o front web (React + TypeScript, D12/D15).

    Regras que valem para toda a API:
    - **Somente leitura** (RNF05, RN05): nenhum endpoint cria ou altera dose.
    - **Dados sintéticos** em desenvolvimento e demonstração (RNF08). Todos os exemplos vêm de
      `docs/banco-de-dados/sintetico/` e usam como data de referência **24/11/2026**.
    - **Privacidade** (RNF04): a API nunca devolve CID, condição clínica, grupo de atendimento,
      CPF, CNS ou dados do profissional que aplicou a dose.
    - A situação vacinal é uma **previsão de rotina**; o aprazamento oficial é do profissional de
      saúde (RN02). Por isso as respostas trazem o aviso "confirme na unidade" e a data da última
      atualização dos dados (RNF09).
    - A pessoa logada só acessa os próprios dados e os dos dependentes vinculados a ela
      (`pessoa_responsavel`). Outra pessoa devolve **403**.
    - Erros seguem o formato Problem Details (RFC 9457), `application/problem+json`.

    Pontos marcados com **[provisório]** dependem de definição de regra de negócio e podem mudar
    (ver `docs/contrato-changelog.md`).
  contact:
    name: Equipe ConectaSaúde Recife (Projeto ARIES)
  license:
    name: Uso restrito ao Projeto ARIES
    identifier: LicenseRef-ARIES
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local (perfil dev)
security:
  - tokenConecta: []
tags:
  - name: Pessoa
    description: Pessoa logada e seus dependentes (RF01, RF02)
  - name: Situação vacinal
    description: Painel-resumo, doses por situação, histórico e detalhe da dose (RF04 a RF08)
  - name: Unidades
    description: Mapa e detalhe das unidades de saúde (RF10 a RF13)
  - name: Campanhas
    description: Campanhas vigentes e elegibilidade (RF18)
  - name: Vacinas
    description: Catálogo de vacinas e doenças que elas previnem (RF22)

paths:
  /v1/eu:
    get:
      tags: [Pessoa]
      operationId: obterEu
      summary: Pessoa logada e seus dependentes
      description: |
        Devolve a pessoa identificada pelo token e as pessoas pelas quais ela é responsável
        (RF01, RF02). É o ponto de entrada do módulo: o front usa os ids daqui nas outras chamadas.
      responses:
        '200':
          description: Pessoa logada e dependentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
              examples:
                responsavelComUmaFilha:
                  summary: Joana (pessoa 4) com a filha Manuela (pessoa 5)
                  value:
                    pessoa:
                      id: 4
                      nome: Joana Leite Oliveira
                      dataNascimento: '1992-01-21'
                    dependentes:
                      - pessoa:
                          id: 5
                          nome: Manuela Gomes Oliveira
                          dataNascimento: '2026-05-08'
                        parentesco: MAE
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /v1/pessoas/{idPessoa}/situacao-vacinal:
    get:
      tags: [Situação vacinal]
      operationId: obterSituacaoVacinal
      summary: Painel-resumo e doses previstas por situação
      description: |
        Calcula a situação de cada dose prevista no calendário para a pessoa (RN01), a partir do
        esquema vacinal, da data de nascimento e dos registros existentes. Alimenta a tela
        "Minha vacinação" (painel-resumo RF06, lista por situação RF05, próxima dose RF07,
        aviso de cartão desatualizado RF08 e data da última atualização RNF09).
      parameters:
        - $ref: '#/components/parameters/IdPessoa'
      responses:
        '200':
          description: Situação vacinal da pessoa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SituacaoVacinal'
              examples:
                bebeDeSeisMeses:
                  summary: Manuela (pessoa 5, nascida em 08/05/2026), exemplo reduzido
                  description: |
                    Recorte das doses até 9 meses. O resumo conta só as doses deste exemplo.
                    A Penta D1 e a Pneumo 10 D2 foram tomadas, mas não chegaram ao sistema
                    (sub-registro da base sintética): aparecem como atrasadas, que é o caso do
                    aviso de cartão desatualizado.
                  value:
                    pessoa:
                      id: 5
                      nome: Manuela Gomes Oliveira
                      dataNascimento: '2026-05-08'
                    dataReferencia: '2026-11-24'
                    dataUltimaAtualizacao: '2026-11-18T15:07:00-03:00'
                    resumo:
                      atrasadas: 2
                      podeTomar: 1
                      emDia: 8
                      aindaNaoDisponiveis: 2
                    proximaDose:
                      idDose: 8
                      vacina: { id: 3, nome: Penta (DTP/Hib/HB) }
                      numeroDose: 3
                      descricao: 6 meses
                      situacao: AINDA_NAO_DISPONIVEL
                      dataPrevista: '2026-12-17'
                      registro: null
                    doses:
                      - idDose: 1
                        vacina: { id: 1, nome: BCG }
                        numeroDose: 1
                        descricao: Ao nascer (dose única)
                        situacao: EM_DIA
                        dataPrevista: '2026-05-08'
                        registro: { idRegistro: 50, dataAplicacao: '2026-05-09', transcricao: false }
                      - idDose: 2
                        vacina: { id: 2, nome: Hepatite B }
                        numeroDose: 1
                        descricao: Ao nascer (até 30 dias)
                        situacao: EM_DIA
                        dataPrevista: '2026-05-08'
                        registro: { idRegistro: 51, dataAplicacao: '2026-05-10', transcricao: false }
                      - idDose: 6
                        vacina: { id: 3, nome: Penta (DTP/Hib/HB) }
                        numeroDose: 1
                        descricao: 2 meses
                        situacao: ATRASADA
                        dataPrevista: '2026-07-08'
                        registro: null
                      - idDose: 7
                        vacina: { id: 3, nome: Penta (DTP/Hib/HB) }
                        numeroDose: 2
                        descricao: 4 meses
                        situacao: EM_DIA
                        dataPrevista: '2026-09-07'
                        registro: { idRegistro: 52, dataAplicacao: '2026-11-17', transcricao: false }
                      - idDose: 8
                        vacina: { id: 3, nome: Penta (DTP/Hib/HB) }
                        numeroDose: 3
                        descricao: 6 meses
                        situacao: AINDA_NAO_DISPONIVEL
                        dataPrevista: '2026-12-17'
                        registro: null
                      - idDose: 9
                        vacina: { id: 4, nome: Poliomielite inativada (VIP) }
                        numeroDose: 1
                        descricao: 2 meses
                        situacao: EM_DIA

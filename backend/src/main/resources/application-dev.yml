# Perfil de desenvolvimento: carrega também a base sintética (V4). Nunca usar com dados reais.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dados-sinteticos

minha-vacinacao:
  # "Hoje" fixo: a base sintética e os exemplos do contrato usam 24/11/2026. Assim o dev e a
  # demonstração mostram as mesmas situações que os exemplos. Para usar a data real, apague a linha.
  data-referencia: 2026-11-24
  cors:
    # Front em dev (Vite). Com o proxy do Vite o CORS nem é usado; isto cobre quem abrir sem proxy.
    origens-permitidas:
      - http://localhost:5173
      - http://127.0.0.1:5173
  # Tela "Entrar como" (GET /v1/demo/pessoas): quem aparece, na ordem, e o resumo do caso.
  # Só pessoas da base sintética. O resumo não fala de condição de saúde.
  demo:
    pessoas:
      - id: 4
        resumo: "Mãe do Heitor, bebê de 6 meses com doses atrasadas, lembretes e campanha."
      - id: 46
        resumo: "Mãe do João e do Bernardo, bebê de 4 meses com doses atrasadas e uma que fica disponível amanhã."
      - id: 94
        resumo: "Responsável por três crianças. O Heitor, de 1 ano e 5 meses, tem doses fora da idade e a MenACWY atrasada."
      - id: 1
        resumo: "Adulta com uma dose transcrita do cartão físico, sem lote. Mãe da Lívia."
      - id: 115
        resumo: "Pai da Ana, de 1 ano, do Igor, de 6 anos, e do Henrique, de 7 anos."
      - id: 110
        resumo: "Pai de três crianças, entre elas a Clara, recém-nascida de 1 mês."
      - id: 26
        resumo: "Adolescente de 14 anos."
      - id: 402
        resumo: "Idoso de 72 anos."

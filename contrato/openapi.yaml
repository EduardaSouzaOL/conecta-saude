  /v1/ouvidoria:
    get:
      tags: [Só com login gov.br]
      operationId: obterOuvidoria
      summary: Canais de ouvidoria (só com login gov.br)
      description: |
        Canais de ouvidoria para quando a unidade de saúde se recusa a atualizar (transcrever) a
        caderneta ou há outro problema no atendimento de vacinação (RF23, D22). O texto e os canais vêm
        prontos; o front mostra sem mudar a redação.

        - **Só com login gov.br:** quem entrou com e-mail ou outra forma recebe **403**
          `/problemas/login-gov-br-necessario` (D22).
        - Canais (confirmados em 25/11/2026): Ouvidoria Municipal de Saúde do Recife (0800 281 1520),
          WhatsApp ConectaZap ((81) 9117-1407, opção Atendimento e depois Ouvidoria SUS) e
          Ouvidoria-Geral do SUS (OuvSUS, 136).
        - O app **não registra** a manifestação: só mostra os canais (somente leitura, RNF05).
      responses:
        '200':
          description: Canais de ouvidoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ouvidoria'
              examples:
                padrao:
                  summary: Canais da ouvidoria
                  value:
                    orientacao: >-
                      Se a unidade de saúde se recusar a atualizar a sua caderneta, ou se você tiver
                      outro problema no atendimento de vacinação, você pode registrar uma
                      manifestação na ouvidoria.
                    canais:
                      - nome: Ouvidoria Municipal de Saúde do Recife
                        descricao: Para solicitação ou reclamação. A ligação é gratuita.
                        telefone: 0800 281 1520
                        whatsapp: null
                        site: null
                      - nome: ConectaZap (WhatsApp da Prefeitura do Recife)
                        descricao: Escolha "Atendimento" e depois "Ouvidoria SUS".
                        telefone: null
                        whatsapp: (81) 9117-1407
                        site: null
                      - nome: Ouvidoria-Geral do SUS (OuvSUS)
                        descricao: Atendimento do Ministério da Saúde. A ligação é gratuita.
                        telefone: '136'
                        whatsapp: null
                        site: null
                    avisos: []
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Sem login gov.br
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                semGovBr:
                  $ref: '#/components/examples/LoginGovBrNecessario'

components:
  examples:
    LoginGovBrNecessario:
      summary: Entrou com e-mail (ou outra forma), não com gov.br
      value:
        type: /problemas/login-gov-br-necessario
        title: Login gov.br necessário
        status: 403
        detail: Para usar este serviço, entre no Conecta Recife com a sua conta gov.br.

  securitySchemes:
    tokenConecta:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token do login do Conecta Recife (SSO, D15). O formato real ainda não está definido.
        No perfil `dev`, o backend aceita um token falso que indica qual pessoa sintética está
        logada (docs/15, seção 1): `dev-pessoa-<id>` simula login com **gov.br** e
        `dev-pessoa-<id>-email` simula login com **e-mail** (D22). O token real precisa informar o
        método de login **[pendente: SSO da Emprel]**.

  parameters:
    IdPessoa:
      name: idPessoa
      in: path
      required: true
      description: Id da pessoa (a logada ou um dependente vinculado a ela)
      schema:
        type: integer
        minimum: 1
      example: 5

  responses:
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Não autenticado
            status: 401
            detail: Entre de novo no Conecta Recife.
    SemAcesso:
      description: A pessoa logada não é a pessoa pedida nem responsável por ela
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Sem acesso
            status: 403
            detail: Você só pode ver os seus dados e os das pessoas que estão sob a sua responsabilidade.
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Não encontrado
            status: 404
            detail: Não encontramos o que você procurou.
    RequisicaoInvalida:
      description: Parâmetros inválidos (por exemplo, `lat` sem `lng`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Requisição inválida
            status: 400
            detail: Envie latitude e longitude juntas.

  schemas:
    Problema:
      type: object
      description: Problem Details (RFC 9457)
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

    PessoaResumo:
      type: object
      description: Dados mínimos da pessoa. Nunca inclui CPF, CNS ou dados de saúde.
      required: [id, nome, dataNascimento]
      properties:
        id:
          type: integer
        nome:
          type: string
        dataNascimento:
          type: string
          format: date

    Parentesco:
      type: string
      description: Parentesco do responsável com o dependente, como está em `pessoa_responsavel.parentesco`
      examples: [MAE]

    Dependente:
      type: object
      required: [pessoa, parentesco]
      properties:
        pessoa:
          $ref: '#/components/schemas/PessoaResumo'
        parentesco:
          $ref: '#/components/schemas/Parentesco'

    Eu:
      type: object
      required: [pessoa, dependentes, metodoLogin, recursos]
      properties:
        metodoLogin:
          $ref: '#/components/schemas/MetodoLogin'
        recursos:
          $ref: '#/components/schemas/Recursos'
        pessoa:
          $ref: '#/components/schemas/PessoaResumo'
        dependentes:
          type: array
          description: Pessoas vinculadas à pessoa logada como responsável (vínculos sem data de fim)
          items:
            $ref: '#/components/schemas/Dependente'

    MetodoLogin:
      type: string
      description: |
        Como a pessoa entrou no Conecta Recife (D22). `GOV_BR`: conta gov.br. `EMAIL`: e-mail e
        senha do Conecta. `OUTRO`: qualquer outra forma (ex.: rede social). **[provisório]** O nível
        da conta gov.br (bronze, prata, ouro) ainda não é considerado.
      enum: [GOV_BR, EMAIL, OUTRO]

    Recursos:
      type: object
      description: O que a pessoa logada pode usar, conforme o método de login (D22)
      required: [carteiraPdf, ouvidoria]
      properties:
        carteiraPdf:
          type: boolean
          description: '`true` só com login gov.br: pode baixar `GET /v1/pessoas/{idPessoa}/carteira.pdf`'
        ouvidoria:
          type: boolean
          description: '`true` só com login gov.br: pode ver `GET /v1/ouvidoria`'

    ListaPessoasDemo:
      type: object
      required: [pessoas, aviso]
      properties:
        pessoas:
          type: array
          items:
            $ref: '#/components/schemas/PessoaDemo'
        aviso:
          type: string
          description: Texto para mostrar na tela ("Só para demonstração…")

    PessoaDemo:
      type: object
      required: [id, nome, dataNascimento, idade, resumo, dependentes, tokenGovBr, tokenEmail]
      properties:
        id:
          type: integer
        nome:
          type: string
        dataNascimento:
          type: string
          format: date
        idade:
          type: string
          description: Idade em texto ("21 anos", "6 meses"), na data de referência
        resumo:
          type: string
          description: O caso que essa pessoa mostra na demonstração
        dependentes:
          type: array
          items:
            $ref: '#/components/schemas/PessoaResumo'
        tokenGovBr:
          type: string
          description: Token de teste com login gov.br (`dev-pessoa-<id>`)
        tokenEmail:
          type: string
          description: Token de teste com login por e-mail (`dev-pessoa-<id>-email`)

    Ouvidoria:
      type: object
      required: [orientacao, canais, avisos]
      properties:
        orientacao:
          type: string
          description: Texto que explica quando procurar a ouvidoria
        canais:
          type: array
          items:
            $ref: '#/components/schemas/CanalOuvidoria'
        avisos:
          $ref: '#/components/schemas/Avisos'

    CanalOuvidoria:
      type: object
      required: [nome, descricao, telefone, whatsapp, site]
      properties:
        nome:
          type: string
        descricao:
          type: string
        telefone:
          type: [string, 'null']
          description: Número para ligar, como deve aparecer na tela (o front monta o `tel:` só com os dígitos)
        whatsapp:
          type: [string, 'null']
          description: Número de WhatsApp, como deve aparecer na tela (o front abre o WhatsApp com DDI 55 + os dígitos)
        site:
          type: [string, 'null']
          format: uri

    VacinaResumo:
      type: object
      required: [id, nome]
      properties:
        id:
          type: integer
        nome:
          type: string

    DoencaResumo:
      type: object
      required: [id, nome]
      properties:
        id:
          type: integer
        nome:
          type: string

    SituacaoDose:
      type: string
      description: |
        Situação de uma dose prevista (RF05). São só estas 4; não existe "não posso tomar"
        (RN03) nem "em processamento" (D17: a demora de até 15 dias para o registro aparecer
        vira só o aviso `ATRASO_REGISTRO`).

        **Regra oficial (D19, em alinhamento com a SESAU).** Detalhes e fontes em
        `docs/16-regra-situacao-vacinal.md`. Idades e intervalos vêm da tabela `dose_esquema`
        (faixa etária e intervalo mínimo das "Regras de entrada de dados" do PNI; idade
        recomendada do Calendário 2026) e são contados em meses e anos de calendário, como
        escritos nas fontes ("1M15D" = nascimento + 1 mês + 15 dias). A dose anterior é a de
        número anterior no mesmo esquema ou, quando a regra oficial manda, uma dose de outra
        vacina (tabela `dose_anterior_oficial`: Penta D3 antes da DTP R1, última dose com
        componente tetânico antes da dT; a MenACWY aos 12 meses independe da Meningo C pela IN-2026).
        - `EM_DIA`: há registro que cumpre esta dose.
        - `AINDA_NAO_DISPONIVEL`: sem registro e (a) a dose anterior oficial não tem registro
          (a regra oficial exige a dose anterior; `dataDisponivel` fica `null`), ou (b) hoje é antes
          de `dataDisponivel` (idade mínima oficial da dose ou intervalo mínimo depois da anterior).
        - `ATRASADA`: sem registro, já liberada, e hoje é depois de `dataRecomendada` (a dose fica
          atrasada logo depois da idade recomendada).
        - `PODE_TOMAR`: sem registro, já liberada, e hoje ainda não passou de `dataRecomendada`.

        Dose sem registro cuja pessoa já passou da **idade máxima oficial da dose** (ou, quando a
        regra oficial não traz máximo, a do esquema no calendário) não recebe situação: sai de
        `doses` e vai para `dosesForaDaIdade` (ver `SituacaoVacinal`).

        Reforço segue a mesma regra das outras doses: fica disponível na idade mínima oficial,
        respeitando o intervalo mínimo, mesmo antes da `dataRecomendada`.

        Orientações:
        - **Dose anterior sem registro**, e ela já passou da idade recomendada dela:
          `AINDA_NAO_DISPONIVEL` com a orientação `DOSE_ANTERIOR_SEM_REGISTRO`.
        - **Passou da idade recomendada, mas o intervalo mínimo ainda não foi cumprido:**
          `AINDA_NAO_DISPONIVEL`, com `dataDisponivel` dizendo quando libera, e a orientação
          `ATUALIZAR_CADERNETA`.
      enum: [ATRASADA, PODE_TOMAR, EM_DIA, AINDA_NAO_DISPONIVEL]

    RegistroResumo:
      type: object
      description: Registro que cumpre a dose
      required: [idRegistro, dataAplicacao, transcricao, unidade]
      properties:
        idRegistro:
          type: integer
        dataAplicacao:
          type: string
          format: date
        transcricao:
          type: boolean
          description: Verdadeiro quando o registro veio da transcrição do cartão físico (`fonte_primaria = false`)
        unidade:
          description: Unidade onde a dose foi aplicada, se for uma unidade conhecida
          oneOf:
            - $ref: '#/components/schemas/UnidadeResumo'
            - type: 'null'

    DosePrevista:
      type: object
      required: [idDose, idEsquema, vacina, numeroDose, nomeDose, descricao, situacao, dataRecomendada, dataDisponivel, registro, orientacoes]
      properties:
        idDose:
          type: integer
          description: Id da dose no calendário (`dose_esquema`)
        idEsquema:
          type: integer
          description: Id do esquema vacinal (`esquema_vacinal`)
        vacina:
          $ref: '#/components/schemas/VacinaResumo'
        numeroDose:
          type: integer
          minimum: 1
          description: |
            Ordem da dose no esquema (1 = primeira). Serve para ordenar; para mostrar a dose, use
            `nomeDose` (o 1º reforço da VIP é a dose número 4, mas o nome é "1º reforço").
        nomeDose:
          $ref: '#/components/schemas/NomeDose'
        descricao:
          type: string
          description: Descrição da dose no calendário (ex. "2 meses", "Reforço aos 4 anos")
        situacao:
          $ref: '#/components/schemas/SituacaoDose'
        dataRecomendada:
          type: [string, 'null']
          format: date
          description: |
            Data de nascimento + idade recomendada no calendário (`idade_recomendada_periodo`).
            Depois dela, a dose sem registro fica `ATRASADA`. `null` quando o calendário não
            tem idade recomendada (ex. Hepatite B ≥ 7 anos, que nunca fica atrasada).
        dataDisponivel:
          type: [string, 'null']
          format: date
          description: |
            A partir de quando a pessoa pode tomar a dose (D19): a data mais tarde entre
            nascimento + idade mínima oficial da dose e data da dose anterior oficial + intervalo
            mínimo oficial, em meses e anos de calendário. Vale também para reforços. `null` quando a dose anterior não tem registro
            (a dose fica `AINDA_NAO_DISPONIVEL` até a anterior ser registrada).
        registro:
          description: Registro que cumpre a dose, ou `null` se não há
          oneOf:
            - $ref: '#/components/schemas/RegistroResumo'
            - type: 'null'
        orientacoes:
          type: array
          description: |
            Orientações desta dose, que o front mostra junto dela, sem mudar o texto: `DOSE_ANTERIOR_SEM_REGISTRO` e `ATUALIZAR_CADERNETA`. Lista vazia se não houver.
          items:
            $ref: '#/components/schemas/Aviso'

    DoseForaDaIdade:
      type: object
      description: |
        Dose sem registro cuja idade máxima oficial a pessoa já passou (D17, D19). Não é
        mostrada como atrasada: o front só orienta a conversar na unidade (aviso
        `DOSE_FORA_DA_IDADE`). Não tem detalhe em `/v1/pessoas/{idPessoa}/doses/{idDose}`
        (devolve 404), mas aparece no acompanhamento consolidado da vacina em
        `/v1/pessoas/{idPessoa}/vacinas/{idVacina}`.
      required: [idDose, idEsquema, vacina, numeroDose, nomeDose, descricao]
      properties:
        idDose:
          type: integer
        idEsquema:
          type: integer
        vacina:
          $ref: '#/components/schemas/VacinaResumo'
        numeroDose:
          type: integer
          minimum: 1
        nomeDose:
          $ref: '#/components/schemas/NomeDose'
        descricao:
          type: string

    NomeDose:
      type: string
      description: |
        Nome da dose em linguagem simples (D21), pronto para mostrar. Vem da descrição oficial da
        dose na RNDS (tabela `rnds_dose`, CodeSystem BRDose), ligada pela coluna
        `dose_esquema.codigo_dose_rnds`, normalizada em minúsculas, como o Calendário Nacional 2026
        nomeia as doses (Instrução Normativa do Calendário Nacional de Vacinação 2026):

        | `codigo_dose_rnds` | Descrição RNDS | `nomeDose` |
        |---|---|---|
        | 1 | 1ª Dose | 1ª dose |
        | 2 | 2ª Dose | 2ª dose |
        | 3 | 3ª Dose | 3ª dose |
        | 6 | 1º Reforço | 1º reforço |
        | 7 | 2º Reforço | 2º reforço |
        | 39 | 3º Reforço | 3º reforço |
        | 38 | Reforço | reforço |
        | 9 | Única | dose única |
        | 8 | Dose | dose |
        | 10 | Revacinação | revacinação |

        Dose sem `codigo_dose_rnds` (ou com um código fora da tabela): "{numeroDose}ª dose".
        O texto começa em minúscula; o front capitaliza quando for o início da frase.
      examples: [2ª dose, 1º reforço, dose única]

    ResumoSituacao:
      type: object
      description: Contagem para o painel-resumo (RF06). Não conta `dosesForaDaIdade`.
      required: [atrasadas, podeTomar, emDia, aindaNaoDisponiveis]
      properties:
        atrasadas:
          type: integer
          minimum: 0
        podeTomar:
          type: integer
          minimum: 0
        emDia:
          type: integer
          minimum: 0
        aindaNaoDisponiveis:
          type: integer
          minimum: 0

    CodigoAviso:
      type: string
      description: |
        - `REGRA_EM_ALINHAMENTO`: as regras de situação ainda estão em alinhamento com a SESAU
          (D17). Sempre presente enquanto as regras forem provisórias.
        - `PREVISAO_DE_ROTINA`: o aprazamento oficial é do profissional; confirme na unidade (RN02).
        - `CARTAO_DESATUALIZADO`: dose no cartão físico que não aparece aqui (RF08).
        - `ATRASO_REGISTRO`: uma vacina tomada pode levar até 15 dias para aparecer (RNF09, D17). Prazo da Portaria GM/MS nº 5.663/2024: até 24 horas nas salas com internet e até 15 dias nas salas sem internet.
        - `DOSE_FORA_DA_IDADE`: há doses em `dosesForaDaIdade`; converse na unidade (D17).

        Só em `orientacoes` de uma dose (docs/16):
        - `DOSE_ANTERIOR_SEM_REGISTRO`: a dose anterior do esquema não tem registro e já passou da
          idade recomendada dela; a dose fica `AINDA_NAO_DISPONIVEL`.
        - `ATUALIZAR_CADERNETA`: passou da idade recomendada, mas o intervalo mínimo depois da dose
          anterior ainda não foi cumprido.
      enum: [REGRA_EM_ALINHAMENTO, PREVISAO_DE_ROTINA, CARTAO_DESATUALIZADO, ATRASO_REGISTRO, DOSE_FORA_DA_IDADE, DOSE_ANTERIOR_SEM_REGISTRO, ATUALIZAR_CADERNETA]

    Aviso:
      type: object
      description: |
        Texto que o front mostra junto da situação vacinal, sem mudar a redação. O front
        mostra todos os avisos que vierem, na ordem recebida.
      required: [codigo, mensagem]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoAviso'
        mensagem:
          type: string

    Avisos:
      type: array
      items:
        $ref: '#/components/schemas/Aviso'

    TipoEsquemaVacina:
      type: string
      description: |
        `DOSES`: vacina com trilha fixa de doses (`CMP-02`, "Etapa X de Y").
        `PERIODICA`: vacina repetida em intervalo regular (ex.: dT a cada 10 anos); sem trilha no card.
      enum: [DOSES, PERIODICA]

    StatusAbaVacina:
      type: string
      description: |
        Aba em que a vacina aparece (RULE-01, nunca "não posso tomar"):
        `ATRASADA` → `PODE_TOMAR` → `EM_DIA` → `PROXIMAS`.
      enum: [ATRASADA, PODE_TOMAR, EM_DIA, PROXIMAS]

    SubsecaoAtrasada:
      type: string
      description: |
        Subseção dentro da aba Atrasada (RULE-02):
        - `AINDA_POSSO_TOMAR`: há dose atrasada dentro da faixa etária oficial.
        - `PRAZO_ENCERRADO`: doses passaram da idade máxima oficial (orientar avaliação na UBS; não entra em `resumoVacinas.atrasadas` nem em `vacinaDestaqueHome`).
      enum: [AINDA_POSSO_TOMAR, PRAZO_ENCERRADO]

    EstadoDoseTrilha:
      type: string
      description: Estado de cada segmento na trilha (`CMP-02`) e na linha do tempo (`SCR-06`).
      enum: [TOMADA, ATRASADA, DISPONIVEL, AGUARDANDO, PRAZO_ENCERRADO]

    DoseNaTrilha:
      type: object
      required: [idDose, idEsquema, numeroDose, nomeDose, descricao, estado, dataRecomendada, dataDisponivel, registro, orientacoes]
      properties:
        idDose:
          type: integer
        idEsquema:
          type: integer
        numeroDose:
          type: integer
          minimum: 1
        nomeDose:
          $ref: '#/components/schemas/NomeDose'
        descricao:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoDoseTrilha'
        dataRecomendada:
          type: [string, 'null']
          format: date
        dataDisponivel:
          type: [string, 'null']
          format: date
        registro:
          oneOf:
            - $ref: '#/components/schemas/RegistroResumo'
            - type: 'null'
        orientacoes:
          $ref: '#/components/schemas/Avisos'

    VacinaSituacao:
      type: object
      description: Card consolidado por vacina (`CMP-01`, `RULE-01`–`RULE-04`).
      required:
        - vacina
        - idEsquema
        - nomeEsquema
        - tipoEsquema
        - statusAba
        - subsecaoAtrasada
        - etapaAtual
        - totalEtapas
        - trilhaDoses
        - dataUltimaDose
        - periodicidadeTexto
        - proximaDataDisponivel
        - podeVerOndeTomar
      properties:
        vacina:
          $ref: '#/components/schemas/VacinaResumo'
        idEsquema:
          type: integer
        nomeEsquema:
          type: string
        tipoEsquema:
          $ref: '#/components/schemas/TipoEsquemaVacina'
        statusAba:
          $ref: '#/components/schemas/StatusAbaVacina'
        subsecaoAtrasada:
          oneOf:
            - $ref: '#/components/schemas/SubsecaoAtrasada'
            - type: 'null'
        etapaAtual:
          type: [integer, 'null']
          minimum: 0
          description: Doses tomadas no esquema (`X` em "Etapa X de Y"). `null` em `PERIODICA`.
        totalEtapas:
          type: [integer, 'null']
          minimum: 1
          description: Total de doses do esquema (`Y` em "Etapa X de Y"). `null` em `PERIODICA`.
        trilhaDoses:
          type: array
          description: Segmentos da trilha (`CMP-02`) na ordem do esquema. Vazia em `PERIODICA`.
          items:
            $ref: '#/components/schemas/DoseNaTrilha'
        dataUltimaDose:
          type: [string, 'null']
          format: date
          description: Data de aplicação da última dose registrada desta vacina (útil em `PERIODICA`).
        periodicidadeTexto:
          type: [string, 'null']
          description: Texto de periodicidade (ex. "Reforço a cada 10 anos"). `null` em `DOSES`.
        proximaDataDisponivel:
          type: [string, 'null']
          format: date
          description: Menor `dataDisponivel` dentre as doses ainda não tomadas da vacina.
        podeVerOndeTomar:
          type: boolean
          description: '`true` em `ATRASADA` (`AINDA_POSSO_TOMAR`) e `PODE_TOMAR`; `false` em `EM_DIA`, `PROXIMAS` e `PRAZO_ENCERRADO`.'

    ResumoVacinas:
      type: object
      description: Contadores por vacina para o painel-resumo (`RULE-03`). Não conta vacinas em `PRAZO_ENCERRADO` (D19/IN-2026).
      required: [atrasadas, podeTomar, emDia, proximas]
      properties:
        atrasadas:
          type: integer
          minimum: 0
        podeTomar:
          type: integer
          minimum: 0
        emDia:
          type: integer
          minimum: 0
        proximas:
          type: integer
          minimum: 0

    SituacaoVacinal:
      type: object
      required: [pessoa, dataReferencia, dataUltimaAtualizacao, dataUltimaSincronizacao, resumo, resumoVacinas, proximaDose, vacinaDestaqueHome, vacinas, doses, dosesForaDaIdade, avisos]
      properties:
        pessoa:
          $ref: '#/components/schemas/PessoaResumo'
        dataReferencia:
          type: string
          format: date
          description: Data usada no cálculo (hoje, no fuso de Recife)
        dataUltimaAtualizacao:
          type: [string, 'null']
          format: date-time
          description: |
            Quando o registro mais recente desta pessoa chegou à fonte (RNDS). `null` se a pessoa
            não tem registros.
        dataUltimaSincronizacao:
          type: [string, 'null']
          format: date-time
          description: |
            Data da última importação concluída da fonte (`importacao_dados`). Alimenta
            "Histórico atualizado em [data]" na tela SCR-04.
        resumo:
          $ref: '#/components/schemas/ResumoSituacao'
        resumoVacinas:
          $ref: '#/components/schemas/ResumoVacinas'
        proximaDose:
          description: |
            Próxima dose prevista de rotina que vai ficar disponível (RF07; aprazamento oficial é do
            profissional na unidade, MNP-2024 p. 140–141): a dose `AINDA_NAO_DISPONIVEL` com a menor
            `dataDisponivel`. Dose sem `dataDisponivel` (falta a anterior) não entra. `null` se não houver.
          oneOf:
            - $ref: '#/components/schemas/DosePrevista'
            - type: 'null'
        vacinaDestaqueHome:
          description: |
            Vacina em destaque no card "Acompanhe suas vacinações" na Home do Conecta (`SCR-02`, `RULE-04`):
            a vacina em `ATRASADA` (`AINDA_POSSO_TOMAR`) com a dose atrasada há mais tempo. `null` se não
            houver vacina atrasada dentro da faixa etária (o card não aparece).
          oneOf:
            - $ref: '#/components/schemas/VacinaSituacao'
            - type: 'null'
        vacinas:
          type: array
          description: Projeção consolidada por vacina para os cards `CMP-01` e as 4 abas de `SCR-04`/`SCR-05`.
          items:
            $ref: '#/components/schemas/VacinaSituacao'
        doses:
          type: array
          description: Doses previstas no calendário para a pessoa, ordenadas por `dataRecomendada`
          items:
            $ref: '#/components/schemas/DosePrevista'
        dosesForaDaIdade:
          type: array
          description: Doses sem registro cuja idade máxima oficial já passou (D17, D19). Lista vazia se não houver
          items:
            $ref: '#/components/schemas/DoseForaDaIdade'
        avisos:
          $ref: '#/components/schemas/Avisos'

    CodigoDescricao:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
        sigla:
          type: [string, 'null']
        descricao:
          type: [string, 'null']

    Fabricante:
      type: object
      required: [codigo, nome]
      properties:
        codigo:
          type: [string, 'null']
          description: Código BRFabricantePNI
        nome:
          type: string
          description: Nome por extenso (ou o display oficial, se não houver)

    UnidadeResumo:
      type: object
      required: [id, nome]
      properties:
        id:
          type: integer
        nome:
          type: string

    RegistroVacinacao:
      type: object
      description: |
        Um registro de vacinação (espelho somente leitura de um `Immunization` da RNDS).
        Não inclui dados do profissional que aplicou a dose nem motivo de indicação.
      required: [id, idDose, vacina, imunobiologico, dose, estrategia, dataAplicacao, lote, fabricante, unidade, transcricao, dataRegistroNaFonte]
      properties:
        id:
          type: integer
        idDose:
          type: [integer, 'null']
          description: Dose do calendário que este registro cumpre. `null` quando o registro não se encaixa no calendário (ex. tetra viral, HPV em esquema especial)
        vacina:
          description: Vacina do catálogo do app (de-para do código RNDS). `null` se o código não está no catálogo
          oneOf:
            - $ref: '#/components/schemas/VacinaResumo'
            - type: 'null'
        imunobiologico:
          $ref: '#/components/schemas/CodigoDescricao'
        dose:
          $ref: '#/components/schemas/CodigoDescricao'
        estrategia:
          $ref: '#/components/schemas/CodigoDescricao'
        dataAplicacao:
          type: string
          format: date
        lote:
          type: [string, 'null']
          description: Pode faltar em transcrição
        fabricante:
          description: Pode faltar em transcrição
          oneOf:
            - $ref: '#/components/schemas/Fabricante'
            - type: 'null'
        unidade:
          description: Unidade onde a dose foi aplicada, se for uma unidade conhecida
          oneOf:
            - $ref: '#/components/schemas/UnidadeResumo'
            - type: 'null'
        transcricao:
          type: boolean
          description: Verdadeiro quando o registro veio da transcrição do cartão físico (`fonte_primaria = false`)
        dataRegistroNaFonte:
          type: [string, 'null']
          format: date-time
          description: Quando o registro ficou disponível na fonte (RNDS)

    ListaRegistros:
      type: object
      required: [idPessoa, dataUltimaAtualizacao, registros]
      properties:
        idPessoa:
          type: integer
        dataUltimaAtualizacao:
          type: [string, 'null']
          format: date-time
        registros:
          type: array
          items:
            $ref: '#/components/schemas/RegistroVacinacao'

    DetalheDose:
      type: object
      required: [idPessoa, dose, esquema, intervaloMinimoDias, doencas, registros, dataUltimaAtualizacao, avisos]
      properties:
        idPessoa:
          type: integer
        dose:
          $ref: '#/components/schemas/DosePrevista'
        esquema:
          type: string
          description: Nome do esquema vacinal
        intervaloMinimoDias:
          type: [integer, 'null']
          description: Intervalo mínimo oficial após a dose anterior do esquema, em dias (D19)
        doencas:
          type: array
          description: Doenças que a vacina previne
          items:
            $ref: '#/components/schemas/DoencaResumo'
        registros:
          type: array
          description: Registros que cumprem esta dose
          items:
            $ref: '#/components/schemas/RegistroVacinacao'
        dataUltimaAtualizacao:
          type: [string, 'null']
          format: date-time
        avisos:
          $ref: '#/components/schemas/Avisos'

    DetalheVacina:
      type: object
      description: Acompanhamento consolidado de uma vacina (`SCR-06`).
      required:
        - idPessoa
        - vacina
        - idEsquema
        - nomeEsquema
        - tipoEsquema
        - statusAba
        - subsecaoAtrasada
        - etapaAtual
        - totalEtapas
        - dataUltimaDose
        - periodicidadeTexto
        - proximaDataDisponivel
        - podeVerOndeTomar
        - doencas
        - protocolo
        - registros
        - dataUltimaAtualizacao
        - dataUltimaSincronizacao
        - avisos
      properties:
        idPessoa:
          type: integer
        vacina:
          $ref: '#/components/schemas/VacinaResumo'
        idEsquema:
          type: integer
        nomeEsquema:
          type: string
        tipoEsquema:
          $ref: '#/components/schemas/TipoEsquemaVacina'
        statusAba:
          $ref: '#/components/schemas/StatusAbaVacina'
        subsecaoAtrasada:
          oneOf:
            - $ref: '#/components/schemas/SubsecaoAtrasada'
            - type: 'null'
        etapaAtual:
          type: [integer, 'null']
          minimum: 0
        totalEtapas:
          type: [integer, 'null']
          minimum: 1
        dataUltimaDose:
          type: [string, 'null']
          format: date
        periodicidadeTexto:
          type: [string, 'null']
        proximaDataDisponivel:
          type: [string, 'null']
          format: date
        podeVerOndeTomar:
          type: boolean
        doencas:
          type: array
          items:
            $ref: '#/components/schemas/DoencaResumo'
        protocolo:
          type: array
          description: Linha do tempo de doses da vacina, na ordem do esquema (preenchida mesmo em `PERIODICA`).
          items:
            $ref: '#/components/schemas/DoseNaTrilha'
        registros:
          type: array
          description: Registros RNDS desta vacina (incluindo equivalentes, ex. SCRV).
          items:
            $ref: '#/components/schemas/RegistroVacinacao'
        dataUltimaAtualizacao:
          type: [string, 'null']
          format: date-time
        dataUltimaSincronizacao:
          type: [string, 'null']
          format: date-time
        avisos:
          $ref: '#/components/schemas/Avisos'

    Disponibilidade:
      type: string
      description: Disponibilidade da vacina na unidade, informada pela Prefeitura. `SEM_INFORMACAO` quando não há dado
      enum: [DISPONIVEL, INDISPONIVEL, TEMPORARIAMENTE_INDISPONIVEL, SEM_INFORMACAO]

    Unidade:
      type: object
      required: [id, nome, tipo, endereco, distritoSanitario, latitude, longitude, possuiSalaVacina, telefone, horarioFuncionamento]
      properties:
        id:
          type: integer
        nome:
          type: string
        tipo:
          type: string
          description: Tipo da unidade (USF, POLICLINICA, MATERNIDADE…)
        endereco:
          type: string
        distritoSanitario:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        possuiSalaVacina:
          type: boolean
        telefone:
          type: [string, 'null']
        horarioFuncionamento:
          type: [string, 'null']
          description: |
            Horário da sala de vacina, em texto, como vem da fonte (ex.: "Segunda à sexta das 08:00 às 17:00",
            "24 horas"). Fonte: base aberta "Rede de atenção à saúde no Recife" (dados.recife.pe.gov.br, campo
            `horario`), ligada pelo CNES. Na base sintética, horário fixo por tipo de unidade. `null` = sem informação.

    UnidadeNoMapa:
      allOf:
        - $ref: '#/components/schemas/Unidade'
        - type: object
          required: [distanciaMetros, disponibilidadeVacina]
          properties:
            distanciaMetros:
              type: [integer, 'null']
              description: Distância em linha reta até o ponto informado. `null` sem `lat`/`lng`
            disponibilidadeVacina:
              description: Disponibilidade da vacina filtrada. `null` sem o filtro `vacina`
              oneOf:
                - $ref: '#/components/schemas/Disponibilidade'
                - type: 'null'

    ListaUnidades:
      type: object
      required: [unidades, avisoPortaAberta]
      properties:
        unidades:
          type: array
          items:
            $ref: '#/components/schemas/UnidadeNoMapa'
        avisoPortaAberta:
          type: string

    VacinaNaUnidade:
      type: object
      required: [vacina, disponibilidade, dataAtualizacao]
      properties:
        vacina:
          $ref: '#/components/schemas/VacinaResumo'
        disponibilidade:
          $ref: '#/components/schemas/Disponibilidade'
        dataAtualizacao:
          type: [string, 'null']
          format: date-time

    DetalheUnidade:
      allOf:
        - $ref: '#/components/schemas/Unidade'
        - type: object
          required: [cnes, vacinas, avisoPortaAberta]
          properties:
            cnes:
              type: [string, 'null']
            vacinas:
              type: array
              items:
                $ref: '#/components/schemas/VacinaNaUnidade'
            avisoPortaAberta:
              type: string

    Campanha:
      type: object
      required: [id, nome, descricao, dataInicio, dataFim, publicoAlvo, status, seletiva, vacinas, elegivel]
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: [string, 'null']
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
        publicoAlvo:
          type: string
        status:
          type: string
          enum: [PLANEJADA, ATIVA, ENCERRADA, CANCELADA]
        seletiva:
          type: boolean
          description: |
            Campanha **seletiva** (`campanha.seletiva`, D21): de atualização de caderneta, que aplica
            só as doses necessárias para iniciar ou completar o esquema (ex.: Multivacinação 2026,
            [MS-MULTI-2026]). `false` quando a campanha vacina todo o público dela, sem olhar a
            caderneta (ex.: influenza anual). Muda a regra de `elegivel`.
        vacinas:
          type: array
          items:
            $ref: '#/components/schemas/VacinaResumo'
        elegivel:
          type: [boolean, 'null']
          description: |
            Se a campanha é para a pessoa de `idPessoa` (RF18, D21), na `dataReferencia` (hoje):
            1. **Faixa etária (sempre):** a pessoa está numa faixa etária cadastrada para a
               campanha (`campanha_faixa_etaria`), com a mesma convenção de idade de
               `docs/16-regra-situacao-vacinal.md`: nascimento + `idade_minima_periodo` ≤ hoje <
               nascimento + `idade_limite_periodo` (o limite é o dia em que a pessoa já está fora;
               "menores de 15 anos", ou seja, até 14 anos, 11 meses e 29 dias, é `P15Y`;
               `idade_limite_periodo` nulo = sem limite de cima, ex. "60 anos ou mais"). Com mais
               de uma faixa, basta estar em uma.
            2. **Dose a fazer (só se `seletiva` é `true`):** a pessoa tem também pelo menos uma dose
               `ATRASADA` ou `PODE_TOMAR` (em `doses` da situação vacinal) de uma vacina da
               campanha (`campanha_vacina`). A campanha seletiva aplica "somente as doses
               necessárias para iniciar ou completar o esquema" [MS-MULTI-2026]. Se `seletiva` é
               `false` (ex.: influenza anual), basta a faixa etária: o público da campanha é por idade.

            `true` quando valem as condições que se aplicam à campanha; `false` quando a campanha
            tem faixa etária e alguma delas não vale (ex.: fora da faixa; ou, em campanha seletiva,
            na faixa, mas sem dose atrasada ou disponível de vacina da campanha). `null` sem
            `idPessoa` ou quando a campanha não tem faixa etária cadastrada (público que não é por
            idade, como gestantes ou grupos): a API não decide e o front mostra só o `publicoAlvo`.

    ListaCampanhas:
      type: object
      required: [campanhas]
      properties:
        campanhas:
          type: array
          items:
            $ref: '#/components/schemas/Campanha'

    Vacina:
      type: object
      required: [id, nome, descricao, doencas]
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: [string, 'null']
        doencas:
          type: array
          items:
            $ref: '#/components/schemas/DoencaResumo'

    ListaVacinas:
      type: object
      required: [vacinas]
      properties:
        vacinas:
          type: array
          items:
            $ref: '#/components/schemas/Vacina'

    TipoLembrete:
      type: string
      description: |
        A que o lembrete se refere (RN08): sempre a uma dose prevista (`DOSE`) **ou** a uma
        campanha (`CAMPANHA`).
      enum: [DOSE, CAMPANHA]

    MotivoLembrete:
      type: string
      description: |
        Por que o lembrete existe (D20). As regras seguem o PNI e o Ministério da Saúde (D21).
        Vem da situação vacinal da pessoa
        (`GET /v1/pessoas/{idPessoa}/situacao-vacinal`, mesma `dataReferencia`) e das campanhas
        vigentes:
        - `DOSE_ATRASADA`: cada dose de `doses` com situação `ATRASADA`. Não há limite de tempo de
          atraso: o esquema em atraso deve ser atualizado "o mais breve possível" (Instrução
          Normativa do Calendário Nacional 2026). O limite é a idade máxima oficial da dose: depois
          dela, a dose sai de `doses` e vai para `dosesForaDaIdade`, que não gera lembrete.
        - `DOSE_DISPONIVEL`: cada dose de `doses` com situação `PODE_TOMAR`.
        - `DOSE_DISPONIVEL_EM_BREVE`: cada dose de `doses` com situação `AINDA_NAO_DISPONIVEL` e
          `dataDisponivel` não nula, até 7 dias depois da `dataReferencia` (inclusive; com
          `dataReferencia` 24/11/2026, até 01/12/2026). O Ministério da Saúde não define
          antecedência para lembrete; a revisão sistemática de Currie et al. (BMC Public Health
          2024;24:1753) mostra lembretes eficazes enviados de 1 a 7 dias antes e nenhum ensaio com
          30 dias (D21, Adan, 25/11/2026). Doses mais distantes aparecem só na aba "Próximas" do front.
        - `CAMPANHA_VIGENTE`: cada campanha vigente na `dataReferencia` (as mesmas de
          `GET /v1/campanhas?vigentes=true`) **para a qual a pessoa é elegível**, com a regra de
          `Campanha.elegivel` (`true`): a pessoa está numa faixa etária da campanha e, se a
          campanha é `seletiva`, também tem pelo menos uma dose `ATRASADA` ou `PODE_TOMAR` de uma
          vacina da campanha; se não é seletiva, basta a faixa. Um lembrete por pessoa e campanha,
          mesmo que haja várias doses a fazer.
          Campanha com `elegivel` `false` ou `null` (sem faixa etária cadastrada, como público de
          gestantes ou de grupos) não gera lembrete.

        Não geram lembrete: doses `EM_DIA`; doses em `dosesForaDaIdade` (o app só orienta
        "converse na unidade"); doses `AINDA_NAO_DISPONIVEL` fora da janela de 7 dias; e doses
        `AINDA_NAO_DISPONIVEL` sem `dataDisponivel` porque falta a dose anterior. Nesse último
        caso o lembrete é o da **dose anterior**, que aparece como atrasada ou disponível
        enquanto estiver na idade: o esquema não é reiniciado e "sem D1 não há D2" (Regras de
        entrada de dados do PNI; Instrução Normativa do Calendário Nacional 2026).
      enum: [DOSE_ATRASADA, DOSE_DISPONIVEL, DOSE_DISPONIVEL_EM_BREVE, CAMPANHA_VIGENTE]

    Lembrete:
      type: object
      description: |
        Lembrete mostrado **dentro do app** (sino), calculado na hora (D20). Não é gravado e não
        vira push. Nunca traz CID, condição clínica ou grupo de atendimento.

        **Ordem na lista**: primeiro por `motivo`
        (`DOSE_ATRASADA`, `DOSE_DISPONIVEL`, `DOSE_DISPONIVEL_EM_BREVE`, `CAMPANHA_VIGENTE`); depois
        por `data` (mais cedo primeiro); depois pela pessoa, na ordem de `pessoas` (a logada
        primeiro, depois os dependentes na ordem de `GET /v1/eu`); por fim, para dose, na ordem em
        que a dose aparece em `doses` da situação vacinal e, para campanha, por `idCampanha`.

        **Textos** (RNF01, RN03: nunca "não posso tomar"). Gerados pela API com estes modelos, para
        o texto ficar igual em todas as telas. `{nome}` é o primeiro nome da pessoa; quando a
        pessoa do lembrete é a logada, usa-se o modelo "você". `{dose}` é `nomeDose` da dose
        (D21; ex. "2ª dose", "1º reforço", "dose única"); `{vacina}` é `vacina.nome`; datas no
        formato dd/mm/aaaa.

        O artigo e a concordância seguem o gênero de `nomeDose`: **masculino** quando o nome tem
        "reforço" ("o 1º reforço", "do reforço", "seu", "atrasado"); **feminino** nos demais
        ("a 2ª dose", "da dose única", "da revacinação", "sua", "atrasada"). Na tabela,
        `{a|o}` indica essa escolha.

        | Motivo | `titulo` (dependente / logada) | `mensagem` (dependente / logada) |
        |---|---|---|
        | `DOSE_ATRASADA` | "{A\|O} {dose} da vacina {vacina} de {nome} está {atrasada\|atrasado}" / "{A sua\|O seu} {dose} da vacina {vacina} está {atrasada\|atrasado}" | "Procure uma unidade de saúde com {nome}. Vacina é porta aberta: pode ser em qualquer unidade. Confirme na unidade." / "Procure uma unidade de saúde para tomar. Vacina é porta aberta: pode ser em qualquer unidade. Confirme na unidade." |
        | `DOSE_DISPONIVEL` | "Hora {da\|do} {dose} da vacina {vacina} de {nome}" / "Hora {da sua\|do seu} {dose} da vacina {vacina}" | "{nome} já pode tomar esta dose. Procure uma unidade de saúde com {nome}. Confirme na unidade." / "Você já pode tomar esta dose. Procure uma unidade de saúde. Confirme na unidade." |
        | `DOSE_DISPONIVEL_EM_BREVE` | "Em breve: {dose} da vacina {vacina} de {nome}" / "Em breve: {sua\|seu} {dose} da vacina {vacina}" | "A partir de {data}, {nome} já pode tomar esta dose. Confirme na unidade." / "A partir de {data}, você já pode tomar esta dose. Confirme na unidade." |
        | `CAMPANHA_VIGENTE`, campanha seletiva | "Está acontecendo: {campanha.nome}" (igual nos dois casos) | "A caderneta de {nome} tem vacina para colocar em dia. A campanha vai até {campanha.dataFim}. Procure uma unidade de saúde com {nome}. Confirme na unidade." / "A sua caderneta tem vacina para colocar em dia. A campanha vai até {campanha.dataFim}. Procure uma unidade de saúde. Confirme na unidade." |
        | `CAMPANHA_VIGENTE`, campanha não seletiva | "Está acontecendo: {campanha.nome}" (igual nos dois casos) | "{nome} faz parte do público da {campanha.nome}. Não é preciso ter dose atrasada: basta levar {nome} e a caderneta a uma unidade de saúde até {campanha.dataFim}. Confirme na unidade." / "Você faz parte do público da {campanha.nome}. Não é preciso ter dose atrasada: basta ir a uma unidade de saúde com a sua caderneta até {campanha.dataFim}. Confirme na unidade." |

        Exemplos de título: "Hora da 2ª dose da vacina Meningocócica C conjugada de Bernardo";
        "Hora do 1º reforço da vacina DTP (tríplice bacteriana) de Heitor"; "O seu reforço da
        vacina Dupla adulto (dT) está atrasado"; "Em breve: sua dose única da vacina HPV
        quadrivalente".

        `textoNotificacao` é sempre "Há uma novidade na vacinação de {nome}. Abra o Conecta Recife
        para ver." (dependente) ou "Há uma novidade na sua vacinação. Abra o Conecta Recife para
        ver." (logada), sem vacina, dose, situação ou campanha (RNF03).
      required: [id, tipo, motivo, pessoa, data, titulo, mensagem, textoNotificacao, vacina, idDose, idCampanha]
      properties:
        id:
          type: string
          description: |
            Identificador estável e determinístico, que o front usa para marcar "visto" (só em
            memória). Formato: `dose-{idPessoa}-{idDose}-{atrasada|disponivel|em-breve}` ou
            `campanha-{idPessoa}-{idCampanha}`. O motivo entra no id da dose de propósito: quando
            uma dose "em breve" passa a "já pode tomar", vira um lembrete novo (não visto).
          pattern: '^(dose-[0-9]+-[0-9]+-(atrasada|disponivel|em-breve)|campanha-[0-9]+-[0-9]+)$'
          examples: [dose-48-20-disponivel]
        tipo:
          $ref: '#/components/schemas/TipoLembrete'
        motivo:
          $ref: '#/components/schemas/MotivoLembrete'
        pessoa:
          $ref: '#/components/schemas/PessoaResumo'
        data:
          type: string
          format: date
          description: |
            `DOSE_DISPONIVEL_EM_BREVE`: a `dataDisponivel` da dose. `DOSE_ATRASADA` e
            `DOSE_DISPONIVEL`: a `dataReferencia` (hoje). `CAMPANHA_VIGENTE`: a `dataInicio` da campanha.
        titulo:
          type: string
          description: Texto curto em linguagem simples, para o app (ver modelos acima)
        mensagem:
          type: string
          description: Texto em linguagem simples, para o app; sempre termina pedindo para confirmar na unidade
        textoNotificacao:
          type: string
          description: |
            Versão sem dado de saúde, para tela de bloqueio ou aparelho compartilhado (RNF03). Hoje
            não há push (D20); o campo já fica pronto para quando houver.
        vacina:
          description: Vacina da dose (`DOSE`), para abrir o mapa filtrado (RF10). `null` em `CAMPANHA`
          oneOf:
            - $ref: '#/components/schemas/VacinaResumo'
            - type: 'null'
        idDose:
          type: [integer, 'null']
          description: Id da dose no calendário (`dose_esquema`), para abrir o detalhe da dose. Preenchido só em `DOSE`
        idCampanha:
          type: [integer, 'null']
          description: Id da campanha (`GET /v1/campanhas`). Preenchido só em `CAMPANHA`

    PessoaNosLembretes:
      type: object
      description: Pessoa coberta pela lista de lembretes, com a data da última atualização dos dados dela (RNF09)
      required: [pessoa, dataUltimaAtualizacao]
      properties:
        pessoa:
          $ref: '#/components/schemas/PessoaResumo'
        dataUltimaAtualizacao:
          type: [string, 'null']
          format: date-time
          description: Mesmo valor de `dataUltimaAtualizacao` da situação vacinal da pessoa **[provisório]**

    ListaLembretes:
      type: object
      required: [dataReferencia, pessoas, lembretes, avisos]
      properties:
        dataReferencia:
          type: string
          format: date
          description: Data usada no cálculo (hoje, no fuso de Recife), a mesma da situação vacinal
        pessoas:
          type: array
          description: |
            Pessoas cobertas pela lista: a logada primeiro, depois os dependentes na ordem de
            `GET /v1/eu` (em `/v1/pessoas/{idPessoa}/lembretes`, só a pessoa pedida). Aparecem
            mesmo quando não têm lembrete.
          items:
            $ref: '#/components/schemas/PessoaNosLembretes'
        lembretes:
          type: array
          description: Lembretes na ordem descrita em `Lembrete`. Lista vazia se não houver
          items:
            $ref: '#/components/schemas/Lembrete'
        avisos:
          description: |
            Sempre `REGRA_EM_ALINHAMENTO`, `PREVISAO_DE_ROTINA` e `ATRASO_REGISTRO`, nesta ordem,
            com o mesmo texto da situação vacinal. O front mostra todos, sem mudar o texto.
          allOf:
            - $ref: '#/components/schemas/Avisos'

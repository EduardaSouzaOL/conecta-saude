                          - { id: 12, nome: Hepatite A }
                          - { id: 13, nome: DTP (tríplice bacteriana) }
                          - { id: 14, nome: HPV quadrivalente }
                        elegivel: false
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':

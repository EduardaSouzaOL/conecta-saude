openapi: 3.1.0
info:
  title: Minha vacinação · API do ConectaSaúde Recife
  version: 0.5.0
  summary: Situação vacinal, histórico de doses, lembretes, unidades, campanhas e vacinas para o módulo "Minha vacinação" do Conecta Recife.
  description: |
    Contrato **v0.5** do microsserviço do módulo "Minha vacinação" (decisão D14). É a fonte de verdade
    para o backend (Spring Boot) e para o front web (React + TypeScript, D12/D15).

    Regras que valem para toda a API:
    - **Somente leitura** (RNF05, RN05): nenhum endpoint cria ou altera dose.
    - **Dados sintéticos** em desenvolvimento e demonstração (RNF08). Todos os exemplos vêm de
      `docs/banco-de-dados/sintetico/` e usam como data de referência **24/11/2026**.
    - **Privacidade** (RNF04): a API nunca devolve CID, condição clínica, grupo de atendimento,
      CPF, CNS ou dados do profissional que aplicou a dose.
    - A situação vacinal é uma **previsão de rotina**; o aprazamento oficial é do profissional de
      saúde (RN02). Por isso as respostas trazem o aviso "confirme na unidade" e a data da última
      atualização dos dados (RNF09).
    - **Regra oficial (D19):** a situação da dose segue as fontes oficiais do PNI (faixa etária,
      intervalo mínimo e sequência das "Regras de entrada de dados"; idade recomendada do
      Calendário 2026), descritas em `docs/16-regra-situacao-vacinal.md`. A regra ainda está em
      alinhamento com a Secretaria de Saúde. Enquanto isso, toda resposta de situação vacinal e de detalhe da dose
      traz em `avisos` o item `REGRA_EM_ALINHAMENTO`, e o front mostra todos os `avisos` recebidos.
    - **Lembretes no app (D20):** calculados na hora a partir da situação vacinal e das campanhas
      vigentes. A API não grava lembrete nem notificação e não envia push; continua somente leitura.
    - A pessoa logada só acessa os próprios dados e os dos dependentes vinculados a ela
      (`pessoa_responsavel`). Outra pessoa devolve **403**.
    - Erros seguem o formato Problem Details (RFC 9457), `application/problem+json`.

    Pontos marcados com **[provisório]** dependem de definição de regra de negócio e podem mudar
    (ver `docs/contrato-changelog.md`).
  contact:
    name: Equipe ConectaSaúde Recife (Projeto ARIES)
  license:
    name: Uso restrito ao Projeto ARIES
    identifier: LicenseRef-ARIES
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local (perfil dev)
security:
  - tokenConecta: []
tags:
  - name: Pessoa
    description: Pessoa logada e seus dependentes (RF01, RF02)
  - name: Situação vacinal
    description: Painel-resumo, doses por situação, histórico e detalhe da dose (RF04 a RF08)
  - name: Unidades
    description: Mapa e detalhe das unidades de saúde (RF10 a RF13)
  - name: Lembretes
    description: Lembretes de dose e de campanha mostrados no app, sem push e sem gravar nada (RF19, RN08, D20)
  - name: Campanhas
    description: Campanhas vigentes e elegibilidade (RF18)
  - name: Vacinas
    description: Catálogo de vacinas e doenças que elas previnem (RF22)

paths:
  /v1/eu:
    get:
      tags: [Pessoa]
      operationId: obterEu
      summary: Pessoa logada e seus dependentes
      description: |
        Devolve a pessoa identificada pelo token e as pessoas pelas quais ela é responsável
        (RF01, RF02). É o ponto de entrada do módulo: o front usa os ids daqui nas outras chamadas.
      responses:
        '200':
          description: Pessoa logada e dependentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
              examples:
                responsavelComUmFilho:
                  summary: Valentina (pessoa 4) com o filho Heitor (pessoa 5)
                  value:
                    pessoa:
                      id: 4
                      nome: Valentina Oliveira Ferreira
                      dataNascimento: '2005-11-12'
                    dependentes:
                      - pessoa:
                          id: 5
                          nome: Heitor Nascimento Ferreira
                          dataNascimento: '2026-05-07'
                        parentesco: MAE
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /v1/eu/lembretes:
    get:
      tags: [Lembretes]
      operationId: listarMeusLembretes
      summary: Lembretes da pessoa logada e dos dependentes (o sino)
      description: |
        Lembretes de dose e de campanha da pessoa logada **e** de cada dependente vinculado a ela
        (RF19, RN08, D20). Alimenta o sino do protótipo.

        **Calculados na hora** a partir da situação vacinal de cada pessoa
        (`GET /v1/pessoas/{idPessoa}/situacao-vacinal`, mesma `dataReferencia`) e das campanhas
        vigentes. A API **não grava** lembrete nem notificação e **não envia push**; as tabelas
        `lembrete` e `notificacao` ficam para depois. O front guarda o "visto" só em memória,
        pelo `id` do lembrete.

        Regras de geração e de ordem: ver `Lembrete` e `MotivoLembrete`
        **[provisório, a confirmar com a Duda]**.
      responses:
        '200':
          description: Lembretes da pessoa logada e dos dependentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaLembretes'
              examples:
                valentinaEHeitor:
                  summary: Valentina (pessoa 4, logada) e o filho Heitor (pessoa 5), lista completa
                  description: |
                    Lista completa (não é recorte), derivada da situação vacinal das duas pessoas
                    em 24/11/2026. Valentina tem a tríplice viral D2 atrasada; as doses dela em
                    `dosesForaDaIdade` e a dT sem `dataDisponivel` não geram lembrete. Heitor tem 4
                    doses atrasadas e a VIP D3, que fica disponível em 07/12/2026 (dentro dos
                    próximos 30 dias). A Meningo C D2 dele não gera lembrete porque não tem
                    `dataDisponivel` (falta a D1). A Multivacinação 2026 gera um lembrete para cada
                    pessoa, porque a elegibilidade ainda não é calculada (`elegivel` vem `null`).
                  value:
                    dataReferencia: '2026-11-24'
                    pessoas:
                      - pessoa: { id: 4, nome: Valentina Oliveira Ferreira, dataNascimento: '2005-11-12' }
                        dataUltimaAtualizacao: '2009-12-07T09:48:00-03:00'
                      - pessoa: { id: 5, nome: Heitor Nascimento Ferreira, dataNascimento: '2026-05-07' }
                        dataUltimaAtualizacao: '2026-11-11T14:56:00-03:00'
                    lembretes:
                      - id: dose-4-26-atrasada
                        tipo: DOSE
                        motivo: DOSE_ATRASADA
                        pessoa: { id: 4, nome: Valentina Oliveira Ferreira, dataNascimento: '2005-11-12' }
                        data: '2026-11-24'
                        titulo: A sua 2ª dose da vacina Tríplice viral (SCR) está atrasada
                        mensagem: 'Procure uma unidade de saúde para tomar. Vacina é porta aberta: pode ser em qualquer unidade. Confirme na unidade.'
                        textoNotificacao: Há uma novidade na sua vacinação. Abra o Conecta Recife para ver.
                        vacina: { id: 10, nome: Tríplice viral (SCR) }
                        idDose: 26
                        idCampanha: null
                      - id: dose-5-14-atrasada
                        tipo: DOSE
                        motivo: DOSE_ATRASADA
                        pessoa: { id: 5, nome: Heitor Nascimento Ferreira, dataNascimento: '2026-05-07' }
                        data: '2026-11-24'
                        titulo: A 1ª dose da vacina Rotavírus humano de Heitor está atrasada
                        mensagem: 'Procure uma unidade de saúde com Heitor. Vacina é porta aberta: pode ser em qualquer unidade. Confirme na unidade.'
                        textoNotificacao: Há uma novidade na vacinação de Heitor. Abra o Conecta Recife para ver.
                        vacina: { id: 5, nome: Rotavírus humano }
                        idDose: 14
                        idCampanha: null
                      - id: dose-5-19-atrasada
                        tipo: DOSE
                        motivo: DOSE_ATRASADA
                        pessoa: { id: 5, nome: Heitor Nascimento Ferreira, dataNascimento: '2026-05-07' }
                        data: '2026-11-24'
                        titulo: A 1ª dose da vacina Meningocócica C conjugada de Heitor está atrasada
                        mensagem: 'Procure uma unidade de saúde com Heitor. Vacina é porta aberta: pode ser em qualquer unidade. Confirme na unidade.'
                        textoNotificacao: Há uma novidade na vacinação de Heitor. Abra o Conecta Recife para ver.
                        vacina: { id: 7, nome: Meningocócica C conjugada }
                        idDose: 19
                        idCampanha: null
                      - id: dose-5-17-atrasada
                        tipo: DOSE
                        motivo: DOSE_ATRASADA
                        pessoa: { id: 5, nome: Heitor Nascimento Ferreira, dataNascimento: '2026-05-07' }
                        data: '2026-11-24'
                        titulo: A 2ª dose da vacina Pneumocócica 10-valente de Heitor está atrasada
                        mensagem: 'Procure uma unidade de saúde com Heitor. Vacina é porta aberta: pode ser em qualquer unidade. Confirme na unidade.'
                        textoNotificacao: Há uma novidade na vacinação de Heitor. Abra o Conecta Recife para ver.
                        vacina: { id: 6, nome: Pneumocócica 10-valente }
                        idDose: 17
                        idCampanha: null
                      - id: dose-5-8-atrasada
                        tipo: DOSE
                        motivo: DOSE_ATRASADA
                        pessoa: { id: 5, nome: Heitor Nascimento Ferreira, dataNascimento: '2026-05-07' }
                        data: '2026-11-24'
                        titulo: A 3ª dose da vacina Penta (DTP/Hib/HB) de Heitor está atrasada
                        mensagem: 'Procure uma unidade de saúde com Heitor. Vacina é porta aberta: pode ser em qualquer unidade. Confirme na unidade.'
                        textoNotificacao: Há uma novidade na vacinação de Heitor. Abra o Conecta Recife para ver.
                        vacina: { id: 3, nome: Penta (DTP/Hib/HB) }
                        idDose: 8
                        idCampanha: null
                      - id: dose-5-11-em-breve
                        tipo: DOSE
                        motivo: DOSE_DISPONIVEL_EM_BREVE
                        pessoa: { id: 5, nome: Heitor Nascimento Ferreira, dataNascimento: '2026-05-07' }
                        data: '2026-12-07'
                        titulo: 'Em breve: 3ª dose da vacina Poliomielite inativada (VIP) de Heitor'
                        mensagem: A partir de 07/12/2026, Heitor já pode tomar esta dose. Confirme na unidade.
                        textoNotificacao: Há uma novidade na vacinação de Heitor. Abra o Conecta Recife para ver.
                        vacina: { id: 4, nome: Poliomielite inativada (VIP) }
                        idDose: 11
                        idCampanha: null
                      - id: campanha-4-2
                        tipo: CAMPANHA
                        motivo: CAMPANHA_VIGENTE
                        pessoa: { id: 4, nome: Valentina Oliveira Ferreira, dataNascimento: '2005-11-12' }
                        data: '2026-11-09'
                        titulo: 'Está acontecendo: Multivacinação 2026'
                        mensagem: 'Público: Menores de 15 anos. Vai até 12/12/2026. Veja se é para você e confirme na unidade.'
                        textoNotificacao: Há uma novidade na sua vacinação. Abra o Conecta Recife para ver.
                        vacina: null
                        idDose: null
                        idCampanha: 2
                      - id: campanha-5-2
                        tipo: CAMPANHA
                        motivo: CAMPANHA_VIGENTE
                        pessoa: { id: 5, nome: Heitor Nascimento Ferreira, dataNascimento: '2026-05-07' }
                        data: '2026-11-09'
                        titulo: 'Está acontecendo: Multivacinação 2026'
                        mensagem: 'Público: Menores de 15 anos. Vai até 12/12/2026. Veja se é para Heitor e confirme na unidade.'
                        textoNotificacao: Há uma novidade na vacinação de Heitor. Abra o Conecta Recife para ver.
                        vacina: null
                        idDose: null
                        idCampanha: 2
                    avisos:
                      - { codigo: REGRA_EM_ALINHAMENTO, mensagem: 'Estas regras ainda estão em alinhamento com a Secretaria de Saúde. Confirme sempre na unidade.' }
                      - { codigo: PREVISAO_DE_ROTINA, mensagem: 'Esta é uma previsão de rotina. Quem define as datas das suas doses é o profissional de saúde: confirme na unidade.' }
                      - { codigo: ATRASO_REGISTRO, mensagem: 'Uma vacina tomada pode levar até 14 dias para aparecer aqui.' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /v1/pessoas/{idPessoa}/situacao-vacinal:
    get:
      tags: [Situação vacinal]
      operationId: obterSituacaoVacinal
      summary: Painel-resumo e doses previstas por situação
      description: |
        Calcula a situação de cada dose prevista no calendário para a pessoa (RN01), a partir do
        esquema vacinal, da data de nascimento e dos registros existentes. Alimenta a tela
        "Minha vacinação" (painel-resumo RF06, lista por situação RF05, próxima dose RF07,
        aviso de cartão desatualizado RF08 e data da última atualização RNF09).

        **Regra oficial (D19, `docs/16-regra-situacao-vacinal.md`), em alinhamento com a SESAU.**
        Para cada dose, vale o primeiro passo que se encaixa: (1) há registro: `EM_DIA`;
        (2) a pessoa passou da idade máxima oficial da dose: sai da lista e vai para
        `dosesForaDaIdade`, com o aviso "converse na unidade"; (3) a dose anterior do esquema não
        tem registro: `AINDA_NAO_DISPONIVEL`; (4) antes da idade mínima oficial: `AINDA_NAO_DISPONIVEL`;
        (5) antes do intervalo mínimo depois da dose anterior: `AINDA_NAO_DISPONIVEL`; (6) depois da
        idade recomendada: `ATRASADA`; (7) senão: `PODE_TOMAR`. Reforço segue a mesma regra (idade
        mínima + intervalo mínimo). Não há situação "em processamento": a demora de até 14 dias
        para o registro aparecer é só o aviso `ATRASO_REGISTRO`. Cada dose pode trazer
        `orientacoes` (dose anterior sem registro; atualizar a caderneta), que o front mostra junto dela.
      parameters:
        - $ref: '#/components/parameters/IdPessoa'
      responses:
        '200':
          description: Situação vacinal da pessoa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SituacaoVacinal'
              examples:
                bebeDeSeisMeses:
                  summary: Heitor (pessoa 5, nascido em 07/05/2026), doses até 9 meses
                  description: |
                    Doses do calendário até 9 meses (sem a influenza anual). O resumo conta só
                    as doses deste exemplo. A Rotavírus D1 foi tomada, mas não chegou ao sistema
                    (sub-registro da base sintética): aparece como atrasada, mesmo com a D2
                    registrada, que é o caso do aviso de cartão desatualizado. A VIP D3 já passou
                    da idade recomendada, mas o intervalo mínimo depois da D2 (aplicada em 07/11)
                    ainda não foi cumprido: fica "ainda não disponível" até 07/12, com a
                    orientação `ATUALIZAR_CADERNETA`. A Meningo C D2 fica "ainda não disponível",
                    com a orientação `DOSE_ANTERIOR_SEM_REGISTRO`, porque a D1 não tem registro e a
                    regra oficial exige a dose anterior. A Meningo C D1 libera a partir de 2 meses
                    (idade mínima oficial), embora a idade recomendada seja 3 meses.
                  value:
                    pessoa:
                      id: 5
                      nome: Heitor Nascimento Ferreira
                      dataNascimento: '2026-05-07'
                    dataReferencia: '2026-11-24'
                    dataUltimaAtualizacao: '2026-11-11T14:56:00-03:00'
                    resumo: { atrasadas: 4, podeTomar: 0, emDia: 8, aindaNaoDisponiveis: 3 }
                    proximaDose:
                      { idDose: 11, vacina: { id: 4, nome: Poliomielite inativada (VIP) }, numeroDose: 3, descricao: 6 meses, situacao: AINDA_NAO_DISPONIVEL, dataRecomendada: '2026-11-07', dataDisponivel: '2026-12-07', registro: null, orientacoes: [{ codigo: ATUALIZAR_CADERNETA, mensagem: 'Procure uma unidade de saúde para atualizar sua caderneta.' }] }
                    doses:
                      - { idDose: 1, vacina: { id: 1, nome: BCG }, numeroDose: 1, descricao: Ao nascer (dose única), situacao: EM_DIA, dataRecomendada: '2026-05-07', dataDisponivel: '2026-05-07', registro: { idRegistro: 35, dataAplicacao: '2026-05-07', transcricao: false }, orientacoes: [] }
                      - { idDose: 2, vacina: { id: 2, nome: Hepatite B }, numeroDose: 1, descricao: Ao nascer (até 30 dias), situacao: EM_DIA, dataRecomendada: '2026-05-07', dataDisponivel: '2026-05-07', registro: { idRegistro: 36, dataAplicacao: '2026-05-07', transcricao: false }, orientacoes: [] }
                      - { idDose: 6, vacina: { id: 3, nome: Penta (DTP/Hib/HB) }, numeroDose: 1, descricao: 2 meses, situacao: EM_DIA, dataRecomendada: '2026-07-07', dataDisponivel: '2026-06-22', registro: { idRegistro: 37, dataAplicacao: '2026-07-17', transcricao: false }, orientacoes: [] }
                      - { idDose: 9, vacina: { id: 4, nome: Poliomielite inativada (VIP) }, numeroDose: 1, descricao: 2 meses, situacao: EM_DIA, dataRecomendada: '2026-07-07', dataDisponivel: '2026-06-22', registro: { idRegistro: 39, dataAplicacao: '2026-07-20', transcricao: false }, orientacoes: [] }
                      - { idDose: 14, vacina: { id: 5, nome: Rotavírus humano }, numeroDose: 1, descricao: 2 meses, situacao: ATRASADA, dataRecomendada: '2026-07-07', dataDisponivel: '2026-06-22', registro: null, orientacoes: [] }
                      - { idDose: 16, vacina: { id: 6, nome: Pneumocócica 10-valente }, numeroDose: 1, descricao: 2 meses, situacao: EM_DIA, dataRecomendada: '2026-07-07', dataDisponivel: '2026-07-07', registro: { idRegistro: 42, dataAplicacao: '2026-07-21', transcricao: false }, orientacoes: [] }
                      - { idDose: 19, vacina: { id: 7, nome: Meningocócica C conjugada }, numeroDose: 1, descricao: 3 meses, situacao: ATRASADA, dataRecomendada: '2026-08-07', dataDisponivel: '2026-07-07', registro: null, orientacoes: [] }
                      - { idDose: 7, vacina: { id: 3, nome: Penta (DTP/Hib/HB) }, numeroDose: 2, descricao: 4 meses, situacao: EM_DIA, dataRecomendada: '2026-09-07', dataDisponivel: '2026-08-16', registro: { idRegistro: 38, dataAplicacao: '2026-09-06', transcricao: false }, orientacoes: [] }
                      - { idDose: 10, vacina: { id: 4, nome: Poliomielite inativada (VIP) }, numeroDose: 2, descricao: 4 meses, situacao: EM_DIA, dataRecomendada: '2026-09-07', dataDisponivel: '2026-08-19', registro: { idRegistro: 40, dataAplicacao: '2026-11-07', transcricao: false }, orientacoes: [] }
                      - { idDose: 15, vacina: { id: 5, nome: Rotavírus humano }, numeroDose: 2, descricao: 4 meses, situacao: EM_DIA, dataRecomendada: '2026-09-07', dataDisponivel: null, registro: { idRegistro: 41, dataAplicacao: '2026-11-08', transcricao: false }, orientacoes: [] }
                      - { idDose: 17, vacina: { id: 6, nome: Pneumocócica 10-valente }, numeroDose: 2, descricao: 4 meses, situacao: ATRASADA, dataRecomendada: '2026-09-07', dataDisponivel: '2026-08-20', registro: null, orientacoes: [] }
                      - { idDose: 20, vacina: { id: 7, nome: Meningocócica C conjugada }, numeroDose: 2, descricao: 5 meses, situacao: AINDA_NAO_DISPONIVEL, dataRecomendada: '2026-10-07', dataDisponivel: null, registro: null, orientacoes: [{ codigo: DOSE_ANTERIOR_SEM_REGISTRO, mensagem: 'Não encontramos a dose anterior no seu registro. Procure uma unidade de saúde.' }] }
                      - { idDose: 8, vacina: { id: 3, nome: Penta (DTP/Hib/HB) }, numeroDose: 3, descricao: 6 meses, situacao: ATRASADA, dataRecomendada: '2026-11-07', dataDisponivel: '2026-10-06', registro: null, orientacoes: [] }
                      - { idDose: 11, vacina: { id: 4, nome: Poliomielite inativada (VIP) }, numeroDose: 3, descricao: 6 meses, situacao: AINDA_NAO_DISPONIVEL, dataRecomendada: '2026-11-07', dataDisponivel: '2026-12-07', registro: null, orientacoes: [{ codigo: ATUALIZAR_CADERNETA, mensagem: 'Procure uma unidade de saúde para atualizar sua caderneta.' }] }
                      - { idDose: 23, vacina: { id: 9, nome: Febre amarela }, numeroDose: 1, descricao: 9 meses, situacao: AINDA_NAO_DISPONIVEL, dataRecomendada: '2027-02-07', dataDisponivel: '2027-02-07', registro: null, orientacoes: [] }
                    dosesForaDaIdade: []
                    avisos:
                      - { codigo: REGRA_EM_ALINHAMENTO, mensagem: 'Estas regras ainda estão em alinhamento com a Secretaria de Saúde. Confirme sempre na unidade.' }
                      - { codigo: PREVISAO_DE_ROTINA, mensagem: 'Esta é uma previsão de rotina. Quem define as datas das suas doses é o profissional de saúde: confirme na unidade.' }
                      - { codigo: CARTAO_DESATUALIZADO, mensagem: 'Tem dose no seu cartão físico que não aparece aqui? Procure a unidade mais próxima para atualizar.' }
                      - { codigo: ATRASO_REGISTRO, mensagem: 'Uma vacina tomada pode levar até 14 dias para aparecer aqui.' }
                bebeDeQuatroMeses:
                  summary: Bernardo (pessoa 48, nascido em 13/07/2026), recorte com "já pode tomar"
                  description: |
                    A Meningo C D2 é recomendada aos 5 meses (13/12), mas o intervalo mínimo
                    depois da D1 já foi cumprido em 19/11: "já pode tomar". A Penta D2 já passou da
                    idade recomendada, mas a D1 foi aplicada em 26/10 e o intervalo mínimo só se
                    cumpre em 25/11: "ainda não disponível", com a orientação `ATUALIZAR_CADERNETA`.
                    O resumo conta só as doses do recorte.
                  value:
                    pessoa:
                      id: 48
                      nome: Bernardo Oliveira Andrade
                      dataNascimento: '2026-07-13'
                    dataReferencia: '2026-11-24'
                    dataUltimaAtualizacao: '2026-10-31T16:21:00-03:00'
                    resumo: { atrasadas: 1, podeTomar: 1, emDia: 2, aindaNaoDisponiveis: 1 }
                    proximaDose:
                      { idDose: 7, vacina: { id: 3, nome: Penta (DTP/Hib/HB) }, numeroDose: 2, descricao: 4 meses, situacao: AINDA_NAO_DISPONIVEL, dataRecomendada: '2026-11-13', dataDisponivel: '2026-11-25', registro: null, orientacoes: [{ codigo: ATUALIZAR_CADERNETA, mensagem: 'Procure uma unidade de saúde para atualizar sua caderneta.' }] }

  /v1/unidades:
    get:
      tags: [Unidades]
      operationId: listarUnidades
      security:
        - {}
        - tokenConecta: []
      summary: Unidades de saúde para o mapa
      description: |
        Lista as unidades com sala de vacina (RF10). Com `vacina`, cada unidade traz a
        disponibilidade daquela vacina (RF13). Com `lat` e `lng`, traz a distância e ordena da
        mais próxima para a mais distante. Vacina é porta aberta (RF12, RN04): unidades sem a
        vacina disponível continuam na lista, com a disponibilidade indicada.
      parameters:
        - name: vacina
          in: query
          required: false
          description: Id da vacina do catálogo (`GET /v1/vacinas`)
          schema:
            type: integer
            minimum: 1
          example: 4
        - name: lat
          in: query
          required: false
          description: Latitude do ponto de referência. Enviar junto com `lng`.
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: -8.12
        - name: lng
          in: query
          required: false
          description: Longitude do ponto de referência. Enviar junto com `lat`.
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: -34.93
        - name: somenteDisponiveis
          in: query
          required: false
          description: |
            Quando `true` junto com `vacina`, retorna apenas unidades onde a vacina filtrada está
            `DISPONIVEL` (oferta mensal informada pela Prefeitura, sem estoque em tempo real;
            `avisoPortaAberta` continua obrigatório). Sem `vacina`, ignorado. Padrão `false`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Unidades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaUnidades'
              examples:
                vipPertoDoIbura:
                  summary: VIP, a partir de um ponto no Ibura (recorte com 2 unidades)
                  value:
                    unidades:
                      - id: 9
                        nome: USF Fictícia Ibura
                        tipo: USF
                        endereco: Rua Fictícia do Ibura, 15 – Ibura
                        distritoSanitario: DS VI
                        latitude: -8.127
                        longitude: -34.937
                        possuiSalaVacina: true
                        telefone: (81) 3355-9444
                        horarioFuncionamento: Segunda à sexta das 08:00 às 17:00
                        distanciaMetros: 1095
                        disponibilidadeVacina: DISPONIVEL
                      - id: 8
                        nome: USF Fictícia Boa Viagem
                        tipo: USF
                        endereco: Av. Fictícia de Boa Viagem, 4000 – Boa Viagem
                        distritoSanitario: DS VI
                        latitude: -8.118
                        longitude: -34.897
                        possuiSalaVacina: true
                        telefone: (81) 3355-5654
                        horarioFuncionamento: Segunda à sexta das 08:00 às 17:00
                        distanciaMetros: 3639
                        disponibilidadeVacina: INDISPONIVEL
                    avisoPortaAberta: >-
                      Vacina é porta aberta: você pode se vacinar em qualquer unidade de saúde.
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'


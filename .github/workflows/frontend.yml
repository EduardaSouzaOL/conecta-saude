name: Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checagens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos batem com o contrato
        run: |
          npm run gerar:tipos
          git diff --exit-code -- src/api/esquema.d.ts || (echo "Rode 'npm run gerar:tipos': o contrato mudou." && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - name: Textos proibidos (RN03, RNF04)
        run: npm run checar:textos
      - name: Testes (Vitest)
        run: npm test
      - name: Build (app e demonstração)
        run: npm run build && npm run build:demo
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E em tela de celular (Android e iPhone) com acessibilidade
        run: npm run e2e
      - name: HTML da demonstração
        uses: actions/upload-artifact@v4
        with:
          name: minha-vacinacao-demo
          path: frontend/dist-demo/index.html
      - name: Relatório do E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
